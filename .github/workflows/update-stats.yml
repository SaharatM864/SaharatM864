name: Update GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *" # Run daily at midnight
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate General Stats
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          user: SaharatM864
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Bangkok
          filename: stats/github-metrics.svg
          output_action: none # We will commit manually to handle multiple files

      - name: Generate Top Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          user: SaharatM864
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_limit: 8
          filename: stats/github-metrics-langs.svg
          output_action: none

      - name: Commit & Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git pull origin main # Ensure we have latest changes
          git add stats/github-metrics.svg stats/github-metrics-langs.svg
          git commit -m "Update GitHub Stats [skip ci]" || exit 0
          git push origin main
