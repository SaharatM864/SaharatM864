name: Update GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create stats directory
        run: mkdir -p stats

      - name: Download Stats Images
        run: |
          # Download files directly from the API (method 2 originally suggested) but save as file
          curl -o stats/github-metrics.svg "https://github-readme-stats.vercel.app/api?username=SaharatM864&show_icons=true&theme=tokyonight"
          curl -o stats/github-metrics-langs.svg "https://github-readme-stats.vercel.app/api/top-langs/?username=SaharatM864&layout=compact&theme=tokyonight&langs_count=8"

      - name: Commit & Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git pull origin main
          git add stats/github-metrics.svg stats/github-metrics-langs.svg
          git commit -m "Update GitHub Stats [skip ci]" || exit 0
          git push origin main
